
<div class="card shadow-sm border-0 mb-4 h-100">
  <div class="card-header bg-white border-bottom py-3">
    <h5 class="mb-0 fw-bold d-flex align-items-center">
      <i [class]="'bi ' + icon + ' me-2 text-' + badgeColor"></i>
      <span>{{ title }}</span>
      <span class="badge bg-light text-dark ms-auto border">{{ items.length }}</span>
    </h5>
  </div>
  <div class="card-body p-3">
    @if (items.length === 0) {
      <p class="text-muted small mb-0 fst-italic">No hay registros cargados en esta categoría.</p>
    } @else {
      <div class="list-group list-group-flush">
        @for (item of items; track item.id) {
          <div class="list-group-item px-0 py-3 border-bottom">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <h6 class="fw-bold mb-0 text-dark">{{ item.titulo }}</h6>
              <span class="badge bg-light text-secondary border small">{{ item.periodo }}</span>
            </div>
            <p class="text-primary small fw-semibold mb-1">
              <i class="bi bi-building me-1"></i>{{ item.institucion }}
            </p>
            <p class="text-muted small mb-0">
              {{ item.descripcion }}
            </p>
          </div>
        }
      </div>
    }
  </div>
</div>
